<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Ajanabi Dost — Prototype</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        /* Fallback when JS has not run yet */
        --app-h: 100dvh;
        --app-w: 100vw;
        /* Crop Figma embed top chrome on phones (px) */
        --mobile-top-crop: 46px;
      }

      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--app-h);
        max-height: var(--app-h);
        overflow: hidden;
        background: #000;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        width: var(--app-w, 100%);
        max-width: 100%;
        height: var(--app-h);
        max-height: var(--app-h);
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      .embed-root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        display: flex;
        flex-direction: column;
        background: #000;
      }

      .embed-frame {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        display: block;
        background: #000;
        touch-action: manipulation;
      }

      /* Mobile: crop ~60px embed header via negative top margin + clip */
      @media (max-width: 900px) {
        :root {
          --app-w: 100%;
        }

        body {
          width: 100%;
        }

        .embed-root {
          overflow: hidden;
        }

        .embed-frame {
          margin-top: calc(-1 * var(--mobile-top-crop));
          flex: 1 1 auto;
          min-height: 0;
          height: calc(100% + var(--mobile-top-crop));
          min-height: calc(100% + var(--mobile-top-crop));
        }
      }
    </style>
  </head>
  <body>
    <div class="embed-root">
      <iframe
        class="embed-frame"
        title="Figma prototype"
        src="https://www.figma.com/embed?embed_host=share&amp;url=https%3A%2F%2Fwww.figma.com%2Fproto%2FzeN1qB3bvHccELvelk9CiT%3Fnode-id%3D0-1&amp;hide-ui=1"
        allowfullscreen
      ></iframe>
    </div>
    <script>
      (function () {
        function readViewportSize() {
          var vv = window.visualViewport;
          if (vv) {
            return { w: vv.width, h: vv.height };
          }
          return { w: window.innerWidth, h: window.innerHeight };
        }

        function applyViewportSize() {
          var s = readViewportSize();
          var root = document.documentElement;
          root.style.setProperty("--app-h", s.h + "px");
          root.style.setProperty("--app-w", s.w + "px");
        }

        function scheduleApply() {
          applyViewportSize();
          window.requestAnimationFrame(applyViewportSize);
        }

        applyViewportSize();
        window.addEventListener("resize", scheduleApply, { passive: true });
        window.addEventListener("orientationchange", function () {
          window.setTimeout(scheduleApply, 120);
          window.setTimeout(scheduleApply, 350);
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleApply, {
            passive: true,
          });
          window.visualViewport.addEventListener("scroll", scheduleApply, {
            passive: true,
          });
        }

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) scheduleApply();
        });
      })();
    </script>
  </body>
</html>
